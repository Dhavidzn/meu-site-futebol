<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placar Ao Vivo — Assistir</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #080808;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #0d0d0d;
    }

    ::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 4px;
    }

    .player-page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 1rem;
      justify-content: center;
    }

    .player-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .625rem 1rem;
      max-width: 72rem;
      margin: 0 auto;
      width: 100%;
    }

    .player-top-bar a {
      display: flex;
      align-items: center;
      gap: .5rem;
      text-decoration: none;
      color: rgba(255, 255, 255, .65);
      font-size: .8125rem;
      font-weight: 500;
      transition: color .15s;
    }

    .player-top-bar a:hover {
      color: #fff;
    }

    .player-card {
      max-width: 72rem;
      width: 100%;
      margin: 0 auto;
      background: #0e0e0e;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 1.25rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 48px 96px rgba(0, 0, 0, .6);
      position: relative;
    }

    .player-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      overflow: hidden;
    }

    .player-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .55);
      cursor: pointer;
      transition: opacity .25s;
      z-index: 5;
    }

    .player-overlay.hidden {
      display: none;
    }

    .loading-spinner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .7);
      z-index: 4;
      flex-direction: column;
      gap: 1rem;
    }

    .loading-spinner.active {
      display: flex;
    }

    .spinner-ring {
      width: 3rem;
      height: 3rem;
      border: 3px solid rgba(255, 255, 255, .1);
      border-top-color: #E53935;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .play-circle {
      width: 5rem;
      height: 5rem;
      border-radius: 50%;
      background: #E53935;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(229, 57, 53, .4);
      transition: transform .2s, box-shadow .2s;
    }

    .player-overlay:hover .play-circle {
      transform: scale(1.08);
      box-shadow: 0 0 60px rgba(229, 57, 53, .55);
    }

    #adGate {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 200;
      background: rgba(0, 0, 0, .92);
      justify-content: center;
      align-items: center;
      border-radius: 1.25rem;
    }

    #adGate.active {
      display: flex;
    }

    .ad-gate-card {
      background: #141414;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 22rem;
      width: 90%;
      text-align: center;
    }

    .ad-gate-btn {
      display: inline-block;
      background: #E53935;
      color: #fff;
      border: none;
      border-radius: .75rem;
      padding: .85rem 2rem;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      margin-top: 1.25rem;
    }

    .ad-gate-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(229, 57, 53, .35);
    }

    .ad-gate-close {
      display: inline-block;
      margin-top: .75rem;
      font-size: .75rem;
      color: rgba(255, 255, 255, .3);
      cursor: pointer;
      background: none;
      border: none;
    }

    .ad-gate-close:hover {
      color: rgba(255, 255, 255, .6);
    }

    .game-title {
      font-size: clamp(1rem, 3vw, 1.5rem);
      font-weight: 700;
      color: #fff;
      letter-spacing: -.02em;
    }

    @media (max-width: 768px) {
      .player-card {
        border-radius: .75rem;
      }

      .player-page {
        padding: .5rem;
      }

      #adGate {
        border-radius: .75rem;
      }
    }

    @media (min-width: 1280px) {
      .player-page {
        padding: 1.5rem 5rem;
        justify-content: center;
      }

      .player-card {
        max-width: 64rem;
      }
    }

  </style>
</head>

<body>
  <div class="player-page">

    <div class="player-top-bar">
      <a href="javascript:history.back()">‹ Voltar</a>
      <div style="display:flex;align-items:center;gap:.5rem;">
        <div
          style="width:.5rem;height:.5rem;border-radius:50%;background:#E53935;box-shadow:0 0 8px rgba(229,57,53,.5);">
        </div>
        <span style="font-size:.6875rem;font-weight:700;letter-spacing:.1em;color:#E53935;">AO VIVO</span>
      </div>
      <span class="game-title" id="gameTitle"></span>
    </div>

    <div class="player-card">

      <div id="adGate">
        <div class="ad-gate-card">
          <div
            style="width:3rem;height:3rem;border-radius:50%;background:rgba(229,57,53,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;">
            <span style="font-size:1.5rem;">&#128250;</span>
          </div>
          <h3 style="color:#fff;font-size:1.1rem;font-weight:700;margin-bottom:.5rem;">Assista um anuncio</h3>
          <p style="color:rgba(255,255,255,.4);font-size:.8rem;line-height:1.6;">Abra um anuncio e depois volte para a
            pagina.</p>
          <button class="ad-gate-btn" id="adGateBtn" onclick="watchAd()">Assistir anuncio</button>
          <br>
          <button class="ad-gate-close" onclick="history.back()">Voltar</button>
        </div>
      </div>

      <div class="player-wrap" id="playerWrap">
        <iframe id="playerFrame" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
        <div class="loading-spinner" id="loadingSpinner">
          <div class="spinner-ring"></div>
          <span style="font-size:.75rem;color:rgba(255,255,255,.4);">Carregando transmissão...</span>
        </div>
        <div class="player-overlay" id="playerOverlay" onclick="startStream()">
          <div class="play-circle">
            <span style="color:#fff;font-size:1.75rem;margin-left:.2rem;">&#9654;</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    var games = {
      'Segunda — Jogo 1': 'https://sinalpublicoetv.vercel.app/?id=disneyplus1',
      'Segunda — Jogo 2': 'https://sinalpublicoetv.vercel.app/?id=espn',
      'Segunda — Jogo 3': 'https://sinalpublicoetv.vercel.app/?id=disneyplus2',
      'Terça — Jogo 1': 'https://sinalpublicoetv.vercel.app/?id=espn4',
      'Terça — Jogo 2': 'https://embedcanaisdetv.xyz/e/index.php?canal=disney02',
      'Terça — Jogo 3': 'https://sinalpublicoetv.vercel.app/?id=espn4',
      'Terça — Jogo 4': 'https://embedcanaisdetv.xyz/e/index.php?canal=paramount',
      'Quarta — Jogo 1': 'https://embedcanaisdetv.xyz/e/index.php?canal=amazonprimevideo',
      'Quarta — Jogo 2': 'https://sinalpublicoetv.vercel.app/?id=premiere4',
      'Quarta — Jogo 3': 'https://sinalpublicoetv.vercel.app/?id=premiere2',
      'Quarta — Jogo 4': 'https://sinalpublicoetv.vercel.app/?id=globosp',
      'Quarta — Jogo 5': 'https://sinalpublicoetv.vercel.app/?id=espn',
      'Quarta — Jogo 6': 'https://embedcanaisdetv.xyz/e/index.php?canal=paramount',
      'Quinta — Jogo 1': '',
      'Quinta — Jogo 2': '',
      'Quinta — Jogo 3': '',
      'Sábado — Jogo 1': 'https://sinalpublicoetv.vercel.app/?id=primevideo',
      'Sábado — Jogo 2': 'https://sinalpublicoetv.vercel.app/?id=premiere',
      'Sábado — Jogo 3': 'https://sinalpublicoetv.vercel.app/?id=globorj',
      'Domingo — Jogo 1': 'https://sinalpublicoetv.vercel.app/?id=globosp',
      'Domingo — Jogo 2': 'https://sinalpublicoetv.vercel.app/?id=globomg',
      'Domingo — Jogo 3': 'https://sinalpublicoetv.vercel.app/?id=premiere',
      'Domingo — Jogo 4': 'https://sinalpublicoetv.vercel.app/?id=premiere2',
    };

    var params = new URLSearchParams(window.location.search);
    var jogoKey = params.get('jogo') || '';
    var streamSrc = games[jogoKey] || '';

    document.getElementById('gameTitle').textContent = jogoKey;

    var adWatched = false;

    document.getElementById('adGate').classList.add('active');

    function startStream() {
      if (!streamSrc) return;
      if (adWatched) {
        loadStream();
      } else {
        document.getElementById('adGate').classList.add('active');
      }
    }

    function loadStream() {
      var spinner = document.getElementById('loadingSpinner');
      var iframe = document.getElementById('playerFrame');
      var overlay = document.getElementById('playerOverlay');
      spinner.classList.add('active');
      overlay.classList.add('hidden');
      var src = streamSrc;
      src += (src.includes('?') ? '&' : '?') + 'autoplay=1';
      iframe.onload = function () { spinner.classList.remove('active'); };
      iframe.src = src;
    }

    function watchAd() {
      var btn = document.getElementById('adGateBtn');
      btn.textContent = 'Carregando anuncio...';

      var adWindow = window.open('https://www.effectivecpmnetwork.com/gf2rkzyv6a?key=5a24611e71a9458466907f1a3998bd62', '_blank');

      var lost = false;
      function onBlur() { lost = true; }
      window.addEventListener('blur', onBlur);

      var check = setInterval(function () {
        if (lost || document.hidden) {
          clearInterval(check);
          window.removeEventListener('blur', onBlur);
          var poll = setInterval(function () {
            if (!document.hidden) {
              clearInterval(poll);
              adWatched = true;
              btn.textContent = 'Assistir anuncio';
              document.getElementById('adGate').classList.remove('active');
              loadStream();
            }
          }, 300);
        }
      }, 200);

      setTimeout(function () {
        clearInterval(check);
        window.removeEventListener('blur', onBlur);
        adWatched = true;
        btn.textContent = 'Assistir anuncio';
        document.getElementById('adGate').classList.remove('active');
        loadStream();
      }, 8000);
    }

  </script>
</body>

</html>
